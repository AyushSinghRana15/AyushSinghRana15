  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style><defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0969da"/><stop offset=".5" stop-color="#1a7f37"/><stop offset="1" stop-color="#8250df"/></linearGradient></defs><rect x=".5" y=".5" width="859" height="167" rx="12" fill="#ffffff" stroke="#d0d7de"/><rect x="20" y=".5" width="820" height="2" rx="1" fill="url(#accent)"/><g class="rise"><text x="24" y="38" class="name">Code Fixer</text><text x="24" y="58" class="kicker" style="fill:#0969da">Autonomous bug-fixing agent</text><text x="24" y="82" class="body">Reproduces a reported bug in a sandbox, fixes it, reruns the tests until they pass</text><text x="24" y="100" class="body">and opens a pull request explaining the root cause. Built to run nearly free on</text><text x="24" y="118" class="body">free-tier LLM providers, with a live dashboard and an encrypted key vault.</text><rect x="24.0" y="130" width="51.8" height="20" rx="5" fill="#f6f8fa" stroke="#d0d7de"/><text x="31.0" y="144" class="tag" textLength="37.8">Python</text><rect x="81.8" y="130" width="58.1" height="20" rx="5" fill="#f6f8fa" stroke="#d0d7de"/><text x="88.8" y="144" class="tag" textLength="44.1">FastAPI</text><rect x="145.9" y="130" width="58.1" height="20" rx="5" fill="#f6f8fa" stroke="#d0d7de"/><text x="152.9" y="144" class="tag" textLength="44.1">Next.js</text><rect x="210.0" y="130" width="51.8" height="20" rx="5" fill="#f6f8fa" stroke="#d0d7de"/><text x="217.0" y="144" class="tag" textLength="37.8">Agents</text><text x="580" y="38" class="meta" text-anchor="end">view repo ↗</text></g><g class="rise" style="animation-delay:.2s"><rect x="600" y="20" width="236" height="128" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><line x1="628" y1="76.0" x2="808" y2="76.0" stroke="#d0d7de" stroke-width="3" stroke-linecap="round"/><line x1="628" y1="76.0" x2="808" y2="76.0" stroke="#0969da" stroke-width="3" stroke-linecap="round" pathLength="100" stroke-dasharray="100 100" stroke-dashoffset="0"><animate attributeName