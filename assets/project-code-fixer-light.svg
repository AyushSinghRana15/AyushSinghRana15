<svg xmlns="http://www.w3.org/2000/svg" width="860" height="168" viewBox="0 0 860 168" role="img" aria-label="Code Fixer: Autonomous bug-fixing agent. Reproduces a reported bug in a sandbox, fixes it, reruns the tests until they pass and opens a pull request explaining the root cause. Built to run nearly free on free-tier LLM providers, with a live dashboard and an encrypted key vault."><title>Code Fixer: Autonomous bug-fixing agent. Reproduces a reported bug in a sandbox, fixes it, reruns the tests until they pass and opens a pull request explaining the root cause. Built to run nearly free on free-tier LLM providers, with a live dashboard and an encrypted key vault.</title><style>
